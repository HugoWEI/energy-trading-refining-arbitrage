[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-trading-refining-arbitrage"
version = "0.1.0"
description = "Evidence-led petroleum crack spreads and indicative transatlantic crude-arbitrage scenarios"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Hugo Wei"}]
license = {text = "MIT"}
dependencies = ["pandas>=2.0,<3", "numpy>=1.24,<3", "requests>=2.31,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32,<2", "plotly>=5.20,<7"]
dev = ["pytest>=7.0,<10"]

[project.scripts]
energy-trading = "energy_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
